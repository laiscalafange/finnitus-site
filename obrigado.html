<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0712" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Confirmação de envio da mensagem de contato ao Finnitus." />
  <title>Mensagem enviada — Finnitus</title>
  <link rel="icon" type="image/png" href="assets/finn-icone.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #fff; background: radial-gradient(circle at 50% 5%, #30164d 0, #140a22 44%, #090610 100%); font-family: Raleway, sans-serif; }
    main { width: min(100%, 560px); padding: clamp(28px, 6vw, 55px); border: 1px solid #503766; border-radius: 26px; background: #1c102b; text-align: center; box-shadow: 0 20px 80px #0004; }
    img { width: 82px; max-height: 90px; object-fit: contain; }
    .eyebrow { display: block; margin: 22px 0 10px; font-size: 12px; font-weight: 800; color: #a9ef61; letter-spacing: .11em; }
    h1 { margin: 0 0 15px; font-size: clamp(28px, 5vw, 36px); line-height: 1.2; }
    p { color: #d8c9e7; line-height: 1.7; margin: 0 0 30px; }
    a { display: inline-block; background: linear-gradient(110deg, #6400ef, #5823b8); padding: 16px 28px; border-radius: 12px; color: #fff; text-decoration: none; font-weight: 800; }
    a:focus-visible { outline: 3px solid #a9ef61; outline-offset: 4px; }
    a:hover { filter: brightness(1.15); }
  </style>
</head>
<body>
  <main>
    <img src="assets/finn-icone.png" alt="Mascote Finn, do Finnitus" />
    <span class="eyebrow">CONTATO • FINNITUS</span>
    <h1>Mensagem enviada!</h1>
    <p>Recebemos o seu contato pelo formulário. Obrigado por escrever para a equipe Finnitus!</p>
    <a href="index.html#contato">Voltar para o site</a>
  </main>
</body>
</html>
